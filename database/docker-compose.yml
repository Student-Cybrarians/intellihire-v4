services:
  postgres:
    image: postgres:16-alpine
    container_name: intellihire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: intellihire
      POSTGRES_USER: intellihire
      POSTGRES_PASSWORD: intellihire_dev
    ports:
      - "5432:5432"
    volumes:
      - intellihire_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellihire -d intellihire"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intellihire_pgdata:
